[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-limit-claim-audit"
version = "0.1.0"
description = "Static audit of documented server-side request caps"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
rate-limit-claim-audit = "rate_limit_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["rate_limit_claim_audit*"]
